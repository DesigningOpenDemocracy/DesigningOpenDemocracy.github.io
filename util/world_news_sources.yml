# World news sources for util/world_news.py (the heartbeat's "Read the room"
# step). Each is a publisher's own RSS/Atom/RDF feed, read directly: no
# aggregator re-ranks what reaches us, which is the point of having many
# sources rather than one search. Google News was considered and is
# unavailable anyway: news.google.com/robots.txt disallows /rss for every
# crawler (and names Anthropic's specifically), and robots.txt is honoured.
#
# Picked for spread rather than size: wires and broadcasters from several
# countries, regional outlets in Africa, Asia, the Pacific, Latin America and
# Eurasia, a few non-English feeds, and trackers that cover governance on
# purpose. Every feed below answered with dated items on 2026-10-25. Add to
# it when a good source turns up; a source that keeps failing shows in the
# worklist's "Failing sources" line and can be dropped or replaced.
#
# Fields: name (unique), url, region, lang (ISO 639-1), kind
# (wire | regional | specialist).

# Global wires and international broadcasters
- {name: BBC World, url: "https://feeds.bbci.co.uk/news/world/rss.xml", region: global, lang: en, kind: wire}
- {name: Al Jazeera, url: "https://www.aljazeera.com/xml/rss/all.xml", region: global, lang: en, kind: wire}
- {name: The Guardian World, url: "https://www.theguardian.com/world/rss", region: global, lang: en, kind: wire}
- {name: France 24, url: "https://www.france24.com/en/rss", region: global, lang: en, kind: wire}
- {name: RFI English, url: "https://www.rfi.fr/en/rss", region: global, lang: en, kind: wire}
- {name: DW, url: "https://rss.dw.com/rdf/rss-en-all", region: global, lang: en, kind: wire}

