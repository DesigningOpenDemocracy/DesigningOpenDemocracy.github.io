- {name: Freedom House, url: "https://freedomhouse.org/rss.xml", region: global, lang: en, kind: specialist}
- {name: Global Voices, url: "https://globalvoices.org/feed/", region: global, lang: en, kind: specialist}
- {name: The Conversation (global), url: "https://theconversation.com/global/articles.atom", region: global, lang: en, kind: specialist}

