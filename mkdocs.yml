site_name: Designing Open Democracy
site_url: http://designingopendemocracy.com
repo_url: https://github.com/DesigningOpenDemocracy/DesigningOpenDemocracy.github.io
repo_name: DesigningOpenDemocracy/DesigningOpenDemocracy.github.io
theme:
  name: material
  logo: assets/dodlogo_transparent.png
  custom_dir: docs/overrides
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  language: en
  palette:
    scheme: slate
    primary: blue grey
    accent: indigo
extra_css:
  - assets/css/customizations.css
  - https://unpkg.com/leaflet@1.9.4/dist/leaflet.css
  - https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css
  - https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css
markdown_extensions:
  - footnotes
plugins:
  - search
  - literate-nav:
      nav_file: SUMMARY.md
  - ezlinks:
      wikilinks: true
  - redirects:
      redirect_maps:
        'organisations/organisations.md': 'organisations/index.md'
        'concepts/concepts.md': 'concepts/index.md'
  - blog:
      post_excerpt: required
      archive: true
  - blog:
      blog_dir: heartbeat
      post_excerpt: required
      archive: true
      archive_name: heartbeat.archive
  - rss:
      match_path: blog/posts/.*
      date_from_meta:
        as_creation: date
      categories:
        - categories
        - tags
      image: https://www.designingopendemocracy.com/assets/dodlogo_transparent.png
  - rss:
      match_path: heartbeat/posts/.*
      date_from_meta:
        as_creation: date
      categories:
        - categories
        - tags
      feed_title: "Designing Open Democracy — Heartbeat"
      feed_description: "Automated maintenance sync log for the Democracy Landscape. Not the main DOD blog."
      image: https://www.designingopendemocracy.com/assets/dodlogo_transparent.png
      feeds_filenames:
        rss_created: feed_heartbeat_rss_created.xml
        rss_updated: feed_heartbeat_rss_updated.xml
        json_created: feed_heartbeat_json_created.json
        json_updated: feed_heartbeat_json_updated.json
  - tags
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/DesigningOpenDemocracy/DesigningOpenDemocracy.github.io
      name: Contribute on GitHub
    - icon: fontawesome/brands/telegram
      link: https://t.me/joinchat/HNk_UBX8A7jBPJPbAZU5Zg
      name: Join on Telegram

hooks:
  - hooks/draft_exclude.py
  - hooks/concept_filter.py
  - hooks/shared_link_card.py
  - hooks/event_card.py
  - hooks/blog_post_chips.py
  - hooks/org_template.py
  - hooks/graph_builder.py
  - hooks/llms_txt.py
  - hooks/data_export.py
  - hooks/citation_export.py
  - hooks/activity_selector.py
  - hooks/org_events.py
  - hooks/footnote_fragments.py
  - hooks/calendar_export.py
  - hooks/heartbeat_current.py

not_in_nav: |
  llms.txt
  bot.md

extra_javascript:
  - https://unpkg.com/leaflet@1.9.4/dist/leaflet.js
  - https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js
