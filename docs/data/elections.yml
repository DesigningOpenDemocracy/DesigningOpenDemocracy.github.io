    quote: "The 2028 Queensland state election will be held on or before 28 October 2028 to elect the 59th Parliament of Queensland and its 93 seats."
    url_checked: 2026-09-02

  - date: 2029-03-10
    country: AU
    jurisdiction: Western Australia
    level: state
    title: Western Australian state election
    date_status: fixed
    url: https://en.wikipedia.org/wiki/2029_Western_Australian_state_election
    quote: "The 2029 Western Australian state election is to be held on 10 March 2029, where all 59 seats in the Legislative Assembly and 37 members in the Legislative Council will be contested."
    url_checked: 2026-09-02

  - date: 2030-03-16
