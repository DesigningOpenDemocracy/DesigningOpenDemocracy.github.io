# elections.yml — curated election dates for the site-wide calendar.
#
# Elections are the one kind of date on this calendar that belongs to no
# organisation, so they can't ride on an org page's `events:` list the way
# every other calendar entry does (see CLAUDE.md's Calendar section). They
# live here instead, in one hand-curated file, and are merged into the
# calendar by hooks/calendar_export.py as a third source alongside org
# `events:` and the `ics_feed:` sync cache.
#
# WHAT BELONGS HERE
#   - Australian elections at every level DOD's readers actually vote in:
#     federal, state/territory, and local government where a date is set.
#     DOD is Australian-based, so this part of the list aims to be
#     complete rather than selective.
#   - Elsewhere: national general/presidential elections and a small number
#     of subnational votes of clear interest to this landscape (Taiwan's
#     local elections, say, where two orgs we track do their work). This
#     part is deliberately a curated selection, not a world index —
#     Wikipedia's "List of elections in <year>" already does the complete
#     version far better than we could maintain.
#
#   Listing an election is a statement about the date, not about the
#   election. Nothing here should be read as DOD judging a given contest
#   free, fair, or competitive — and nothing here is a partisan comment on
#   any of them.
#
# WHAT DOESN'T
#   - An election with no date yet. The Tasmanian state election expected
#     in 2029 is the standing example: a calendar entry needs a day, and
#     inventing one to fill the gap would be worse than the omission.
#     Add it once a date exists.
#   - Anything already held. Once an election passes, replace its entry
#     with the next one for that jurisdiction rather than accumulating a
#     history here — the calendar is future-facing, and an org's own page
#     is where history lives. util/check_elections.py prints past entries
#     as a reminder.
#
# FINDING ELECTIONS TO ADD
#   util/discover_elections.py queries Wikidata for upcoming elections and
#   prints the ones this file doesn't list yet. It never writes here, and
#   shouldn't: on 2026-09-02 it gave 30 January 2027 for the NSW state
#   election — the earliest date that election could legally be held, not
#   the 13 March the government actually announced — alongside an item
#   labelled "2022 Bosnian presidential election" dated 2026. It is very
#   good at telling you an election EXISTS (it is how the Tasmanian local
#   elections below got found); the date and the citation still come from
#   reading a real page.
#
# SCHEMA (util/check_elections.py enforces it; CLAUDE.md documents it)
#   date          required, YYYY-MM-DD. The polling day.
#   end_date      optional, inclusive last day for a multi-day poll.
#   country       required, ISO 3166-1 alpha-2, known to calendar_export.py.
#   jurisdiction  optional; the state/region voting, for a subnational one.
#   level         required: national | state | local | supranational
#   title         required; how it reads on the calendar.
#   date_status   required: fixed | expected | deadline
#                   fixed    — the polling day is set (by statute or by a
#                              writ that has been issued).
#                   expected — the date follows from a rule (a fixed term,
#                              a "fourth Saturday" clause) but has not been
#                              formally called. Rendered with a caveat.
#                   deadline — no date called; this is the LAST lawful day
#                              it can be held. Rendered as "due by".
#   date_note     optional; one line on why the date is expected/a deadline.
#   url           required unless `source` is given; the citation.
#   source        required unless `url` is given; a non-URL citation.
#   quote         verbatim sentence from `url` stating the date.
#   note          editorial paraphrase, when no single sentence carries it.
#                 At least one of quote/note is required — same rule org
#                 events follow, for the same reason.
#   url_checked   optional, YYYY-MM-DD; when the citation was last read.

elections:

  # ---- Australia ---------------------------------------------------------

  - date: 2026-11-28
    country: AU
    jurisdiction: Victoria
    level: state
    title: Victorian state election
    date_status: fixed
    url: https://en.wikipedia.org/wiki/2026_Victorian_state_election
    quote: "A state general election is scheduled to be held on 28 November 2026 to elect members of the 61st Parliament of Victoria."
    url_checked: 2026-09-02

  - date: 2026-10-01
    country: AU
    jurisdiction: Tasmania
    level: local
    title: Tasmanian local elections
    date_status: month
    date_note: "An all-postal ballot the Tasmanian Electoral Commission runs across September and October 2026 rather than on one polling day; the calendar shows the month the election is held in."
    url: https://en.wikipedia.org/wiki/2026_Tasmanian_local_elections
    quote: "The 2026 Tasmanian local elections will be held in October 2026 to elect the councils, mayors and deputy mayors of the 29 local government areas (LGAs) in Tasmania."
    url_checked: 2026-09-02

  - date: 2027-03-13
    country: AU
    jurisdiction: New South Wales
    level: state
    title: New South Wales state election
    date_status: fixed
    url: https://en.wikipedia.org/wiki/2027_New_South_Wales_state_election
    date_note: "The fourth-Saturday-in-March default would fall on Holy Saturday in 2027, so the government announced the fortnight earlier date instead."
    quote: "A state general election is scheduled to be held on 13 March 2027 to elect members of the 59th Parliament of New South Wales."
    url_checked: 2026-09-02

