    url: https://en.wikipedia.org/wiki/Next_Australian_federal_election
    quote: "Given that the elections for the new senators must take place by 30 June 2028, the latest possible date for a half-Senate election is 20 May 2028."
    url_checked: 2026-09-02

  - date: 2028-08-26
    country: AU
    jurisdiction: Northern Territory
    level: state
    title: Northern Territory general election
    date_status: expected
    date_note: "Fixed four-year terms set the polling day by rule rather than by announcement; the fourth Saturday of August 2028 is 26 August."
    url: https://en.wikipedia.org/wiki/2024_Northern_Territory_general_election
    quote: "The Legislative Assembly has fixed four-year terms, with elections to be held on the fourth Saturday of August every four years."
    url_checked: 2026-09-02

  - date: 2028-10-21
    country: AU
    jurisdiction: Australian Capital Territory
    level: state
    title: ACT Legislative Assembly election
    date_status: expected
    date_note: "Fixed four-year terms put the poll on the third Saturday of October; the source states the date as expected rather than called."
    url: https://en.wikipedia.org/wiki/Next_Australian_Capital_Territory_election
    quote: "An election is expected to be held in the Australian Capital Territory on 21 October 2028 to elect all 25 members of the unicameral ACT Legislative Assembly."
    url_checked: 2026-09-02

  - date: 2028-10-28
    country: AU
    jurisdiction: Queensland
    level: state
    title: Queensland state election
    date_status: deadline
