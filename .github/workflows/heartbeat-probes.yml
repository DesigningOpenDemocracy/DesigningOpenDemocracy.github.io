name: Heartbeat activity probes

on:
  schedule:
    - cron: "0 3 * * 5"   # weekly, Friday 03:00 UTC
  workflow_dispatch:

jobs:
  probe:
    name: Probe RSS feeds and news pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install util dependencies
        run: pip install -r util/requirements.txt

      - name: Probe RSS feeds and sitemaps
        run: python util/check_rss.py --update-activity

      - name: Scrape news pages
        run: python util/scrape_news.py

      - name: Verify event and footnote evidence still matches live pages
        run: python util/check_fragments.py --save-to-wayback --report /tmp/fragments-report.json
        continue-on-error: true  # report-only: stale evidence shouldn't block the RSS/scrape commit below

      - name: Check event citation URLs are still live
        run: python util/check_event_urls.py --report /tmp/urls-report.json
        continue-on-error: true  # report-only, same reasoning — see job summary/log for findings

      - name: Sync citation-verification tracking issue
        if: always()  # must run even if the two report-only steps above failed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python util/report_tracking_issue.py \
            --fragments-report /tmp/fragments-report.json \
            --urls-report /tmp/urls-report.json

      - name: Commit any updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/organisations/ docs/data/event-evidence-cache.json
          git diff --staged --quiet || git commit -m "chore: automated activity probe — $(date -u +%Y-%m-%d)"
          git push
