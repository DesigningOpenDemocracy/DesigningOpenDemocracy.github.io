name: Heartbeat activity probes

on:
  schedule:
    - cron: "0 3 * * 5"   # weekly, Friday 03:00 UTC
  workflow_dispatch:

jobs:
  probe:
    name: Probe RSS feeds and news pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install util dependencies
        run: pip install -r util/requirements.txt

      - name: Probe RSS feeds and sitemaps
        run: |
          set -o pipefail
          python util/check_rss.py --update-activity | tee /tmp/rss.log

      - name: Scrape news pages
        run: |
          set -o pipefail
          python util/scrape_news.py | tee /tmp/scrape.log

      - name: Verify event and footnote evidence still matches live pages
        id: fragments
        run: |
          set -o pipefail
          python util/check_fragments.py --save-to-wayback --no-page-cache | tee /tmp/fragments.log
        # Non-fatal HERE so a stale citation can't stop the commit below from
        # persisting this run's work — but no longer silently swallowed: the
        # final step fails the job on this step's outcome, after the push.
        continue-on-error: true

      - name: Check event citation URLs are still live
        id: urls
        run: |
          set -o pipefail
          python util/check_event_urls.py | tee /tmp/urls.log
        continue-on-error: true  # same reasoning as above; surfaced by the final step

      - name: Commit any updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/organisations/ docs/data/citation-state.json
          if ! git diff --staged --quiet; then
            SUMMARY=$(
              echo "RSS/sitemap probe:"; tail -n 3 /tmp/rss.log
              echo; echo "News scrape:"; tail -n 6 /tmp/scrape.log
              echo; echo "Fragment verification:"; tail -n 6 /tmp/fragments.log
              echo; echo "Event URL check:"; tail -n 6 /tmp/urls.log
            )
            git commit -m "chore: automated activity probe — $(date -u +%Y-%m-%d)" -m "$SUMMARY"
          fi
          # This job used to run for a couple of hours, when check_fragments.py
          # verified every citation live on every run. It now re-verifies only
          # what has aged past its --max-age window (plus a --spot-check
          # top-up), so a typical week is tens of citations, not ~500. `main`
          # can still move underneath a long run, so rebase onto its tip before
          # pushing rather than risk a rejected push discarding this run's results.
          #
          # citation-state.json is one machine-generated JSON blob, so any
          # concurrent edit to it collides on rebase and git cannot resolve it
          # line-by-line. That killed 9 of the first 10 scheduled runs — each
          # discarded its own commit after hours of work, which is why no
          # citation ever carried an archive_url despite --save-to-wayback
          # running since day one. Resolve that one file by merging both sides'
          # evidence (util/merge_citation_state.py); anything else conflicting
          # is a real problem and still fails loudly.
          git fetch origin main
          if git rebase origin/main; then
            :
          else
            STATE=docs/data/citation-state.json
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            if [ "$CONFLICTS" = "$STATE" ]; then
              echo "Auto-resolving $STATE by merging both sides"
              git show :2:"$STATE" > /tmp/state-ours.json
              git show :3:"$STATE" > /tmp/state-theirs.json
              python util/merge_citation_state.py \
                /tmp/state-ours.json /tmp/state-theirs.json --out "$STATE"
              git add "$STATE"
              GIT_EDITOR=true git rebase --continue
            else
              echo "::error::Rebase conflict outside the citation state file:"
              echo "$CONFLICTS"
              git rebase --abort
              exit 1
            fi
          fi
          # main can move again between the fetch above and this push; one
          # retry through the same resolution path rather than losing the run.
          git push || {
            echo "Push rejected — main moved again; retrying once"
            git fetch origin main
            if ! git rebase origin/main; then
              STATE=docs/data/citation-state.json
              if [ "$(git diff --name-only --diff-filter=U)" = "$STATE" ]; then
                git show :2:"$STATE" > /tmp/state-ours.json
                git show :3:"$STATE" > /tmp/state-theirs.json
                python util/merge_citation_state.py \
                  /tmp/state-ours.json /tmp/state-theirs.json --out "$STATE"
                git add "$STATE"
                GIT_EDITOR=true git rebase --continue
              else
                git rebase --abort
                exit 1
              fi
            fi
            git push
          }

      - name: Surface verification failures
        # Runs after the push, so a failing citation check is visible in the
        # Actions UI without ever costing the run its committed data. Before
        # this, continue-on-error meant a red verification step looked green.
        if: always()
        run: |
          # if/fi rather than `[ ... ] && VAR=...`: these run blocks execute
          # under `bash -e`, where a false test as the last command of an &&
          # chain returns 1 and aborts the step.
          FAILED=""
          if [ "${{ steps.fragments.outcome }}" = "failure" ]; then
            FAILED="$FAILED check_fragments.py"
          fi
          if [ "${{ steps.urls.outcome }}" = "failure" ]; then
            FAILED="$FAILED check_event_urls.py"
          fi
          if [ -n "$FAILED" ]; then
            echo "::error::Citation verification reported problems in:$FAILED"
            echo "--- check_fragments.py ---"; tail -n 25 /tmp/fragments.log 2>/dev/null || true
            echo "--- check_event_urls.py ---"; tail -n 25 /tmp/urls.log 2>/dev/null || true
            exit 1
          fi
          echo "Citation verification clean."
