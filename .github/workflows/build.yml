name: Mkdoc build

on:
  push:
    branches: ["main"]
  pull_request:

env:
  DISABLE_MKDOCS_2_WARNING: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt && pip install pyyaml

      - name: Install test dependencies
        run: pip install -r util/requirements.txt

      - name: Run unit tests
        run: python -m unittest discover tests

      - name: Lint org pages
        run: python util/lint_orgs.py

      - name: Build docs
        run: mkdocs build --strict

      - name: Check internal links
        run: python util/check_internal_links.py

      - name: Check event sourcing
        run: python util/check_event_sourcing.py

      - name: Check frontmatter ordering
        run: python util/reorder_frontmatter.py --check

      - name: Check footnote citations are quoted or justified
        run: python util/check_footnote_quotes.py

      - name: Upload pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/

  deploy:
    name: deploy
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
